name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Action
        run: ./test/validate.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh test/*.sh
